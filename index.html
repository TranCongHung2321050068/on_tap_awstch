<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Luyện Điện Toán Đám Mây & AWS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 15px; }
        .container { max-width: 750px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1a365d; margin-bottom: 20px; font-size: 22px; }
        .screen { display: none; }
        .active { display: block; }
        
        .grid-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-top: 15px; }
        .btn-exam { background: #3182ce; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: left; transition: 0.2s; font-size: 15px; }
        .btn-exam:hover { background: #2b6cb0; transform: translateY(-2px); }

        .progress { font-weight: bold; color: #718096; margin-bottom: 10px; font-size: 14px; }
        .question-title { font-size: 16px; font-weight: bold; color: #1a202c; margin-bottom: 15px; line-height: 1.5; white-space: pre-line; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background: #edf2f7; border: 2px solid #cbd5e0; padding: 12px 15px; border-radius: 8px; font-size: 14px; text-align: left; cursor: pointer; transition: 0.2s; color: #2d3748; line-height: 1.4; }
        .option-btn:hover:not([disabled]) { background: #e2e8f0; }
        
        .option-btn.correct { background-color: #c6f6d5 !important; border-color: #38a169 !important; color: #22543d; font-weight: bold; }
        .option-btn.wrong { background-color: #fed7d7 !important; border-color: #e53e3e !important; color: #742a2a; }
        .feedback { margin-top: 15px; padding: 12px; border-radius: 6px; font-weight: bold; display: none; font-size: 14px; }
        .feedback.correct { background: #e6fffa; color: #234e52; border-left: 4px solid #319795; }
        .feedback.wrong { background: #fff5f5; color: #9b2c2c; border-left: 4px solid #e53e3e; }

        .nav-btns { display: flex; justify-content: space-between; margin-top: 20px; }
        .btn { background: #4a5568; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn:hover { background: #2d3748; }
        .btn-primary { background: #3182ce; }
        .btn-primary:hover { background: #2b6cb0; }

        .result-card { text-align: center; padding: 20px 0; }
        .score { font-size: 36px; font-weight: bold; color: #2b6cb0; margin: 15px 0; }
        .stat-box { display: flex; justify-content: space-around; margin: 20px 0; background: #f7fafc; padding: 15px; border-radius: 8px; }
        .stat-item { text-align: center; }
        .stat-num { font-size: 22px; font-weight: bold; }
        .stat-num.green { color: #38a169; }
        .stat-num.red { color: #e53e3e; }
    </style>
</head>
<body>

<div class="container">
    <div id="screen-home" class="screen active">
        <h1>📚 ÔN THI ĐIỆN TOÁN ĐÁM MÂY</h1>
        <p style="text-align: center; color: #718096; margin-bottom: 15px;">Chọn bộ đề thi để bắt đầu luyện tập:</p>
        <div class="grid-menu">
            <button class="btn-exam" onclick="startExam(1)">📝 Đề 1: AWS Practitioner 1 (20 câu)</button>
            <button class="btn-exam" onclick="startExam(2)">📝 Đề 2: AWS Practitioner 2 (20 câu)</button>
            <button class="btn-exam" onclick="startExam(3)">📝 Đề 3: AWS Practitioner 3 (20 câu)</button>
            <button class="btn-exam" onclick="startExam(4)">📝 Đề 4: AWS Practitioner 4 (17 câu)</button>
            <button class="btn-exam" onclick="startExam(5)">📝 Đề 5: AWS Practitioner 5 (20 câu)</button>
            <button class="btn-exam" onclick="startExam(6)">📝 Đề 6: Knowledge Check (100 câu)</button>
            <button class="btn-exam" onclick="startExam(7)">📝 Đề 7: ĐTĐM C171 - HUMG (45 câu)</button>
        </div>
    </div>

    <div id="screen-quiz" class="screen">
        <div class="progress" id="quiz-progress">Câu hỏi 1/20</div>
        <div class="question-title" id="quiz-question"></div>
        <div class="options" id="quiz-options"></div>
        <div class="feedback" id="quiz-feedback"></div>
        <div class="nav-btns">
            <button class="btn" onclick="goHome()">🏠 Trang chủ</button>
            <button class="btn btn-primary" id="btn-next" onclick="nextQuestion()" style="display:none;">Câu tiếp theo ➔</button>
        </div>
    </div>

    <div id="screen-result" class="screen">
        <div class="result-card">
            <h2>🎉 HOÀN THÀNH BÀI LUYỆN TẬP!</h2>
            <div class="score" id="result-score">0%</div>
            <div class="stat-box">
                <div class="stat-item"><div>Tổng số câu</div><div class="stat-num" id="stat-total">0</div></div>
                <div class="stat-item"><div>Đúng</div><div class="stat-num green" id="stat-correct">0</div></div>
                <div class="stat-item"><div>Sai</div><div class="stat-num red" id="stat-wrong">0</div></div>
            </div>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                <button class="btn" onclick="goHome()">🏠 Về trang chủ</button>
                <button class="btn btn-primary" id="btn-review-wrong" onclick="reviewWrongQuestions()">🔄 Ôn lại các câu sai</button>
            </div>
        </div>
    </div>
</div>

<!-- NỐI FILE DATA -->
<script src="data.js"></script>
<script>
let currentQuestions = [];
let currentQIndex = 0;
let wrongQuestions = [];

function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
}

function goHome() {
    showScreen('screen-home');
}

function startExam(examId) {
    currentQuestions = examsData[examId] || [];
    currentQIndex = 0;
    wrongQuestions = [];
    showScreen('screen-quiz');
    loadQuestion();
}

function loadQuestion() {
    const q = currentQuestions[currentQIndex];
    document.getElementById('quiz-progress').innerText = `Câu hỏi ${currentQIndex + 1}/${currentQuestions.length}`;
    document.getElementById('quiz-question').innerText = q.q;
    
    const optionsContainer = document.getElementById('quiz-options');
    optionsContainer.innerHTML = '';
    
    const feedback = document.getElementById('quiz-feedback');
    feedback.style.display = 'none';
    document.getElementById('btn-next').style.display = 'none';

    q.options.forEach((optText, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${String.fromCharCode(65 + idx)}. ${optText}`;
        btn.onclick = () => checkAnswer(idx, btn);
        optionsContainer.appendChild(btn);
    });
}

function checkAnswer(selectedIdx, selectedBtn) {
    const q = currentQuestions[currentQIndex];
    const buttons = document.querySelectorAll('.option-btn');
    
    buttons.forEach(b => b.disabled = true);
    
    const isCorrect = q.correct.includes(selectedIdx);
    
    if (isCorrect) {
        selectedBtn.classList.add('correct');
        showFeedback(true, "✅ Chính xác!");
    } else {
        selectedBtn.classList.add('wrong');
        q.correct.forEach(cIdx => buttons[cIdx].classList.add('correct'));
        showFeedback(false, `❌ Chưa chính xác. Đáp án đúng là: ${q.correct.map(c => String.fromCharCode(65 + c)).join(', ')}`);
        
        if (!wrongQuestions.includes(q)) {
            wrongQuestions.push(q);
        }
    }
    
    document.getElementById('btn-next').style.display = 'inline-block';
}

function showFeedback(isCorrect, msg) {
    const fb = document.getElementById('quiz-feedback');
    fb.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
    fb.innerText = msg;
    fb.style.display = 'block';
}

function nextQuestion() {
    currentQIndex++;
    if (currentQIndex < currentQuestions.length) {
        loadQuestion();
    } else {
        finishExam();
    }
}

function finishExam() {
    showScreen('screen-result');
    const total = currentQuestions.length;
    const wrong = wrongQuestions.length;
    const correct = total - wrong;
    const percent = Math.round((correct / total) * 100);

    document.getElementById('result-score').innerText = `${percent}%`;
    document.getElementById('stat-total').innerText = total;
    document.getElementById('stat-correct').innerText = correct;
    document.getElementById('stat-wrong').innerText = wrong;

    const btnReview = document.getElementById('btn-review-wrong');
    btnReview.style.display = wrong > 0 ? 'inline-block' : 'none';
}

function reviewWrongQuestions() {
    currentQuestions = [...wrongQuestions];
    wrongQuestions = [];
    currentQIndex = 0;
    showScreen('screen-quiz');
    loadQuestion();
}
</script>
</body>
</html>
